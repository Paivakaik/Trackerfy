<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Página de Vendas (demo) — Curso X</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0f17; color: #e7ecf3; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { max-width: 480px; padding: 40px; text-align: center; }
    h1 { font-size: 28px; }
    p { color: #8a95a8; }
    .price { font-size: 40px; font-weight: 700; color: #00d4a0; margin: 20px 0; }
    button { background: #6c5ce7; color: white; border: none; padding: 16px 32px; font-size: 17px; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .note { margin-top: 30px; font-size: 12px; color: #556; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Curso Completo de Marketing Digital</h1>
    <p>Página de vendas de demonstração — use para testar o rastreamento ponta a ponta.</p>
    <div class="price">R$ 97,00</div>
    <button id="buy">Quero comprar agora</button>
    <div class="note">
      Dica: acesse esta página com UTMs na URL, por exemplo:<br />
      <code>?utm_source=facebook&amp;utm_medium=cpc&amp;utm_campaign=teste1</code>
    </div>
  </div>

  <script
    src="/track.js"
    data-product="demo-produto"
    data-api="/api/track"
  ></script>
  <script>
    document.getElementById("buy").addEventListener("click", function () {
      trackfy("initiate_checkout");
      window.location.href = "/demo/checkout.html";
    });
  </script>
</body>
</html>
