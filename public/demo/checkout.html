<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Checkout (demo) — Curso X</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0f17; color: #e7ecf3; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { max-width: 420px; padding: 40px; text-align: center; }
    h1 { font-size: 24px; }
    p { color: #8a95a8; }
    input { display: block; width: 100%; padding: 10px 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #232c3d; background: #161d2b; color: #e7ecf3; }
    button { background: #00d4a0; color: #0b0f17; border: none; padding: 16px 32px; font-size: 17px; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Finalizar compra</h1>
    <p>Checkout de demonstração — R$ 97,00</p>
    <input placeholder="Nome completo" />
    <input placeholder="E-mail" />
    <input placeholder="Cartão de crédito (qualquer valor, é só demo)" />
    <button id="pay">Confirmar pagamento</button>
  </div>

  <script
    src="/track.js"
    data-product="demo-produto"
    data-api="/api/track"
  ></script>
  <script>
    document.getElementById("pay").addEventListener("click", function () {
      window.location.href = "/demo/obrigado.html";
    });
  </script>
</body>
</html>
